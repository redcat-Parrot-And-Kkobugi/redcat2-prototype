# surfaces.conf — optional, data-driven extension of the surface labeler (_hook_surface, lib/hook_log.sh).
#
# WHY: the per-call labeler ships a domain-general built-in pack (service/phase/technique) plus a
# structural fallback (an unmatched action is labeled by its own tool name + @target, never a bare
# "other"). This file lets an operator or a specific box ADD labels the built-in pack doesn't cover —
# WITHOUT editing code. It is the data half of the hybrid: structural key as the never-collapse base,
# a data map for extra grouping/labels on top.
#
# FORMAT: one rule per line, "<extended-regex><TAB><label>"  (TAB-separated; '#' lines and blanks ignored).
#   - the regex is matched (grep -E, case-insensitive input) against the lowercased command string;
#   - on a match the <label> is ADDED (independent, multi-label — it does not replace built-in labels).
# Keep labels domain-general and short; keep regexes tight to avoid false positives. Override the path
# with RC2_SURFACES_CONF=/path/to/file.
#
# EXAMPLES (uncomment / adapt; these are illustrative, not box-specific):
# jenkins|/script|groovy	ci
# grafana|kibana|:3000|:5601	dashboard
# graphql|/graphql|introspection	graphql
# jwt|\.well-known|oidc|saml	sso
# vault|consul|:8200|:8500	secrets-store
#
# (Left empty by default — the built-in pack is enough for the common domains.)
